[package]
name = "sakura-search"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.2", features = [ "window-minimize", "clipboard-read-text", "clipboard-write-text", "system-tray", "fs-exists", "fs-read-file", "fs-create-dir", "path-all", "fs-write-file", "window-set-focus", "window-start-dragging", "window-show", "window-set-size", "window-set-position", "window-hide", "global-shortcut-all", "window-close", "notification-all", "shell-open", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
